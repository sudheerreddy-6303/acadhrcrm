<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AcadHr CRM</title>
    <!-- Loader shown while the app downloads (React replaces it once ready) -->
    <style>
      .boot-loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #f5f6fa; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .boot-loader img { width: 180px; max-width: 60vw; height: auto; }
      .boot-loader .boot-video { width: 320px; max-width: 80vw; aspect-ratio: 16 / 9; height: auto; object-fit: cover; mix-blend-mode: multiply; }
      .boot-loader .ring { width: 44px; height: 44px; border-radius: 50%; border: 4px solid #e7e9f6; border-top-color: #4f46e5; border-right-color: #f59e0b; animation: boot-spin 0.8s linear infinite; }
      .boot-loader p { margin: 0; color: #7a8194; font-size: 14px; font-weight: 600; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-loader .ring { animation-duration: 2.4s; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loader" role="status" aria-live="polite">
        <video class="boot-video" src="/loading.mp4" poster="/loading-poster.jpg" autoplay muted loop playsinline preload="auto" aria-hidden="true"></video>
        <p>Loading AcadHr CRM…</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
